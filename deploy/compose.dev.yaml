# Local development stack (PL-OPS-005): init → nats → pulsed → alloy, plus SeaweedFS as the backup S3 target.
# Host ports are overridable with PULSE_DEV_{NATS,ADMIN,METRICS,PUBLIC,ALLOY}_PORT when the defaults are taken.
# `make dev-up` generates deploy/.dev/master.key (gitignored) and builds pulsed:dev from the repo.
# pebble runs in `make test-acme`, not here (ADR-0032).

x-pulse-env: &pulse-env
  PULSE_PROFILE: dev
  PULSE_LOG_LEVEL: debug
  PULSE_MASTER_KEY_FILE: /run/secrets/pulse_master_key
  PULSE_RAW_HOST: localhost
  PULSE_NATS_URL: tls://nats:4222
  PULSE_NATS_TLS_NAME: nats
  PULSE_NATS_WEBSOCKET_URL: http://nats:8080
  PULSE_ADMIN_ADDR: 0.0.0.0:8080
  PULSE_ADMIN_PUBLISHED_LOOPBACK: "true"
  # Dashboard sign-in (ADR-0038): `make dev-admin` prints the first administrator's setup link. The long reauth window
  # (dev only; prod allows at most 15m) keeps e2e and screenshot runs from stopping at re-authentication prompts.
  PULSE_ADMIN_URL: http://127.0.0.1:${PULSE_DEV_ADMIN_PORT:-8080}
  PULSE_REAUTH_WINDOW: 1h
  PULSE_METRICS_ADDR: 0.0.0.0:9464
  PULSE_HEALTHCHECK_URL: http://127.0.0.1:9464/readyz
  PULSE_PUBLIC_ADDR: 0.0.0.0:8443
  PULSE_EVENTS_MAX_BYTES: 2GiB

x-backup-env: &backup-env
  PULSE_BACKUP_ENABLED: "true"
  PULSE_BACKUP_S3_ENDPOINT: seaweedfs:8333
  PULSE_BACKUP_S3_BUCKET: pulse-dev
  PULSE_BACKUP_S3_INSECURE: "true"
  PULSE_BACKUP_S3_CREATE_BUCKET: "true"
  PULSE_BACKUP_S3_LOOKUP: path
  PULSE_BACKUP_S3_ACCESS_KEY: pulse-dev
  PULSE_BACKUP_S3_SECRET_KEY: pulse-dev-not-a-secret # gitleaks:allow (dev-only SeaweedFS credential, deploy/dev/seaweedfs-s3.json)
  PULSE_BACKUP_AGE_RECIPIENTS_FILE: /run/secrets/backup_age_recipients

secrets:
  pulse_master_key:
    file: ./.dev/master.key
  backup_age_recipients:
    file: ./.dev/age.pub

volumes:
  pulsed-data:
  nats-data:
  seaweedfs-data:

services:
  init:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: dev
    image: pulsed:dev
    command: ["init"]
    environment: *pulse-env
    secrets: [pulse_master_key]
    volumes:
      - pulsed-data:/data/pulsed
      - nats-data:/data/nats
    network_mode: none
    healthcheck:
      disable: true
    mem_limit: 128m

  nats:
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    user: "65532:65532"
    command: ["-c", "/data/nats/nats.conf"]
    environment:
      GOMEMLIMIT: 600MiB
    volumes:
      - nats-data:/data/nats
    ports:
      - "127.0.0.1:${PULSE_DEV_NATS_PORT:-4222}:4222"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 900m
    restart: unless-stopped

  pulsed:
    image: pulsed:dev
    command: ["serve"]
    environment:
      <<: [*pulse-env, *backup-env]
      GOMEMLIMIT: 300MiB
    secrets: [pulse_master_key, backup_age_recipients]
    volumes:
      - pulsed-data:/data/pulsed
      - nats-data:/data/nats
    ports:
      - "127.0.0.1:${PULSE_DEV_ADMIN_PORT:-8080}:8080"
      - "127.0.0.1:${PULSE_DEV_METRICS_PORT:-9464}:9464"
      - "127.0.0.1:${PULSE_DEV_PUBLIC_PORT:-8443}:8443"
    depends_on:
      nats:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    mem_limit: 448m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./dev/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "127.0.0.1:${PULSE_DEV_ALLOY_PORT:-12345}:12345"
    depends_on:
      pulsed:
        condition: service_healthy
    mem_limit: 192m
    restart: unless-stopped

  # Backup target (S3 API on 8333). Version 4.48, pinned by digest; dev and tests only.
  seaweedfs:
    image: chrislusf/seaweedfs:latest@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=64", "-volume.max=8"]
    volumes:
      - seaweedfs-data:/data
      - ./dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${PULSE_DEV_S3_PORT:-8333}:8333"
    mem_limit: 256m
    restart: unless-stopped
