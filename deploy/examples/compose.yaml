# Reference production topology (PL-OPS-006). The deployment repository (events-wan-lt) renders its own copy of this
# file from docs/operator/configuration.md and pins the pulsed image by digest.
#
# Host prerequisites (see events-wan-lt): Docker with userland-proxy=false and ip6tables=true; nftables table
# inet pulse_edge (CF-only 443, ban sets); secrets under /srv/pulse/secrets owned by uid 65532, mode 0400.
#
# Services marked (Mx) depend on features that land in that milestone.

x-pulse-env: &pulse-env
  PULSE_PROFILE: prod
  PULSE_MASTER_KEY_FILE: /run/secrets/pulse_master_key
  PULSE_PUBLIC_HOST: events.example.com
  PULSE_RAW_HOST: r.events.example.com
  PULSE_NATS_URL: tls://nats:4222
  PULSE_NATS_TLS_NAME: nats
  PULSE_ADMIN_ADDR: 0.0.0.0:8080
  PULSE_ADMIN_PUBLISHED_LOOPBACK: "true"
  PULSE_METRICS_ADDR: 0.0.0.0:9464
  PULSE_PUBLIC_ADDR: 0.0.0.0:8443
  PULSE_EVENTS_MAX_BYTES: 30GiB # deployment computes 60% of the data disk
  PULSE_ORIGIN_CERT_FILE: /run/secrets/cf_origin_cert   # Terraform module output origin_certificate_pem
  PULSE_ORIGIN_KEY_FILE: /run/secrets/cf_origin_key     # Terraform module output origin_private_key_pem
  PULSE_AOP_CA_FILE: /run/secrets/aop_ca                 # Terraform module output aop_ca_certificate_pem
  PULSE_HOST_IPS: 192.0.2.10,2001:db8::10                # the VPS's public addresses

secrets:
  pulse_master_key:
    file: /srv/pulse/secrets/master.key
  cf_origin_cert:
    file: /srv/pulse/secrets/cf_origin.crt
  cf_origin_key:
    file: /srv/pulse/secrets/cf_origin.key
  aop_ca:
    file: /srv/pulse/secrets/aop_ca.crt
  acme_cf_token:
    file: /srv/pulse/secrets/acme_cf_token # Terraform module output acme_dns_api_token

networks:
  pulse:
    enable_ipv6: true

volumes:
  pulsed-data:
  nats-data:

services:
  init:
    image: ghcr.io/aurimasniekis/pulsed@sha256:<digest>
    command: ["init"]
    environment: *pulse-env
    secrets: [pulse_master_key]
    volumes: [pulsed-data:/data/pulsed, nats-data:/data/nats]
    network_mode: none
    healthcheck: { disable: true }
    mem_limit: 128m

  nats:
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    user: "65532:65532"
    command: ["-c", "/data/nats/nats.conf"]
    environment: { GOMEMLIMIT: 600MiB }
    volumes: [nats-data:/data/nats]
    networks: [pulse]
    ports:
      - "4222:4222"           # public, IPv4 and IPv6 (raw NATS TLS)
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 900m
    restart: unless-stopped

  pulsed:
    image: ghcr.io/aurimasniekis/pulsed@sha256:<digest>
    command: ["serve"]
    environment:
      <<: *pulse-env
      GOMEMLIMIT: 300MiB
      # Let's Encrypt for r.events.example.com on 4222 (ADR-0032). Only pulsed needs these (not init).
      PULSE_ACME_ENABLED: "true"
      PULSE_ACME_CF_TOKEN_FILE: /run/secrets/acme_cf_token
    secrets: [pulse_master_key, cf_origin_cert, cf_origin_key, aop_ca, acme_cf_token]
    volumes: [pulsed-data:/data/pulsed, nats-data:/data/nats]
    networks: [pulse]
    ports:
      - "443:8443"            # public, Cloudflare ranges only (nftables), AOP mTLS
      - "127.0.0.1:8080:8080" # admin UI + API: host loopback only (ADR-0008)
      - "127.0.0.1:9464:9464" # metrics, health, banagent endpoint: host loopback only
    depends_on:
      nats: { condition: service_healthy }
    mem_limit: 448m
    restart: unless-stopped

  banagent:
    image: ghcr.io/aurimasniekis/pulsed@sha256:<digest>
    command: ["banagent"]
    network_mode: host
    # Added capabilities reach only root processes and the image runs as uid 65532, so banagent runs as root inside
    # the container holding only NET_ADMIN (nft sets) and DAC_READ_SEARCH (its 0600 token owned by 65532).
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      PULSE_BANAGENT_URL: http://127.0.0.1:9464/internal/v1/bans
      PULSE_BANAGENT_TOKEN_FILE: /run/pulse-banagent/token
    volumes:
      - type: volume
        source: pulsed-data
        target: /run/pulse-banagent
        read_only: true
        volume: { subpath: banagent }
    depends_on:
      pulsed: { condition: service_healthy }
    mem_limit: 48m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    network_mode: host
    pid: host
    volumes:
      - /srv/pulse/alloy/config.alloy:/etc/alloy/config.alloy:ro # deploy/examples/config.alloy
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    depends_on:
      pulsed: { condition: service_healthy }
    mem_limit: 192m
    restart: unless-stopped
